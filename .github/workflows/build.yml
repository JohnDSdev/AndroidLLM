name: Build AndroidLLM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: androidllm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          # Hosted Ubuntu runners ship the SDK and cmdline-tools. The old
          # setup-android v3 action now tries to install removed 'tools'.
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Fetch released llama.cpp
        run: |
          mkdir -p vendor
          git clone --depth 1 --branch b12003 https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          # llama.cpp's latest experimental tag, 2026-10-30
          git -C vendor/llama.cpp describe --tags --exact-match | grep -qx b12003
          python3 scripts/prepare_llama.py
          python3 scripts/prepare_app.py
          python3 scripts/fix_v030_regressions.py
          python3 scripts/chatgpt_ui_patch.py
          python3 scripts/performance_patch.py
          python3 scripts/runtime_perf_patch.py
          python3 scripts/controls_gpu_patch.py
          python3 scripts/settings_message_ux_patch.py
          python3 scripts/settings_controls_visibility_patch.py
          python3 scripts/cpu_pretty_scroll_patch.py
          python3 scripts/deprecate_gpu_offload_patch.py
          python3 scripts/stable_cpu_perf_patch.py
          python3 scripts/persistent_model_patch.py
          python3 scripts/k2_batch_compat.py
          python3 scripts/k2_template_compat.py
          python3 scripts/oled_experimental_patch.py
          python3 scripts/oled_refinement_patch.py
          python3 scripts/oled_polish_patch.py
          python3 scripts/oled_model_picker_fix.py
          python3 scripts/thermal_optimizer_patch.py
          python3 scripts/experimental_arm_kernels_patch.py
          python3 scripts/oled_standard_release.py

      - name: Verify generated inference and UX
        run: |
          set -euxo pipefail
          # The pinned llama.cpp checkout must include native K2 Horizon support.
          test -s vendor/llama.cpp/src/models/k2-horizon.cpp
          grep -q 'llama_model_k2_horizon::graph' vendor/llama.cpp/src/models/k2-horizon.cpp
          grep -q 'for (const bool use_jinja : {preferred_jinja, !preferred_jinja})' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q 'g_batch = common_batch(g_context);' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          ! grep -q 'common_batch_clear\|common_batch_add\|llama_batch_init\|llama_batch_free' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          ! grep -q 'GGML_CPU_ARM_ARCH=' vendor/llama.cpp/examples/llama.android/lib/build.gradle.kts
          grep -q 'GGML_VULKAN=OFF' vendor/llama.cpp/examples/llama.android/lib/build.gradle.kts
          ! grep -q 'GGML_VULKAN=ON' vendor/llama.cpp/examples/llama.android/lib/build.gradle.kts
          grep -q 'set(GGML_CPU_KLEIDIAI ON)' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/CMakeLists.txt
          # x86 path keeps KleidiAI OFF; ARM64 path is ON
          grep -q 'cpu_params.n_gpu_layers = 0' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q 'g_gpu_pp_requested = false;' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q 'GPU prompt processing is deprecated and ignored' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q 'stop_generation_position = g_context_size - OVERFLOW_HEADROOM' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q 'configured context window exhausted' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          ! grep -q 'Context full! Shifting' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          ! grep -q 'LOGv("id: %d' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp

          # Chat switching must keep the resident model and reset only conversation/KV state.
          ! grep -q 'System prompt must be set \*\* RIGHT AFTER \*\* model loaded!' vendor/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt
          grep -q 'sameResidentModel' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'Switching chat…' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'private fun invalidateLoadedRuntime()' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'loadedRuntimeKey = key' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt

          # Settings are staged/global and only committed through explicit controls.
          grep -q 'store.applyGlobalSettings(' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'store.resetGlobalSettings()' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'SheetAction("Save")' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'SheetAction("Reset"' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'SheetAction("Cancel")' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'settingsDialog.setCanceledOnTouchOutside(false)' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'sectionLabel("Thinking")' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'sectionLabel("Display")' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'text = "Pretty mode"' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'prettyMode = prettySwitch.isChecked' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'formatVersion", 4' app/src/main/java/com/johndsdev/androidllm/AppStore.kt
          ! grep -q 'Experimental GPU prompt processing' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          ! grep -q '                chat.gpuPromptProcessing,' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt

          # Stable streaming Markdown and autoscroll.
          grep -q 'markwon.setMarkdown(it, snapshot)' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'scrollMessagesToBottom()' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'prettyVisibleChars' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          ! grep -q 'fullScroll(View.FOCUS_DOWN)' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          ! grep -q 'streamingTextView?.append(chunk)' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'Regenerate' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'Edit' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'Code copied' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt

          # DrawerLayout supplies edge-swipe open and reverse-swipe close gestures.
          grep -q 'androidx.drawerlayout.widget.DrawerLayout' app/src/main/res/layout/activity_main.xml
          grep -q 'drawerChatList' app/src/main/res/layout/activity_main.xml
          grep -q 'drawerLayout.openDrawer(GravityCompat.START)' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'private fun openModelOptimizer()' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt

      - name: Verify OLED v0.8.2 polish
        run: |
          grep -q 'leftMargin = dp(8)' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'setColor(color(R.color.surface_alt))' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'app:cardBackgroundColor="@color/surface"' app/src/main/res/layout/activity_main.xml
          grep -q 'versionName = "0.9.0-oled-optimizer"' app/build.gradle.kts

      - name: Verify OLED layout refinements
        run: |
          grep -q 'Select a model below to start chatting.' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'showSettingsDialog()' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'drawerExportButton' app/src/main/res/layout/activity_main.xml
          grep -q 'android:visibility="gone"' app/src/main/res/layout/activity_main.xml

      - name: Verify repaired model picker
        run: |
          grep -q 'versionName = "0.9.0-oled-optimizer"' app/build.gradle.kts
          grep -q 'model_picker_background' app/src/main/res/values/colors.xml
          grep -q 'ic_model_chevron' app/src/main/res/layout/activity_main.xml
          test -s app/src/main/res/drawable/ic_model_chevron.xml

      - name: Test downloader
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        id: build_apk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build-apk.log

      - name: Summarize failed APK build
        if: steps.build_apk.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '=== compiler/linker/configuration errors ==='
            grep -n -E '(^|[[:space:]])(error:|fatal error:|FAILED:|CMake Error|ninja: error|ld: error|undefined reference|Execution failed for task|What went wrong|BUILD FAILED)' build-apk.log | tail -n 250 || true
            echo
            echo '=== final 350 lines ==='
            tail -n 350 build-apk.log
          } > build-apk-summary.txt

      - name: Upload failed-build diagnostics
        if: steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: AndroidLLM-build-diagnostics
          path: build-apk-summary.txt
          if-no-files-found: error

      - name: Fail after diagnostics
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AndroidLLM.apk

      - name: Verify static CPU backend
        run: |
          unzip -l AndroidLLM.apk | tee apk-contents.txt
          grep -q 'lib/arm64-v8a/libai-chat.so' apk-contents.txt

          if grep -q 'lib/arm64-v8a/libggml-cpu.so' apk-contents.txt; then
            echo "Unexpected dynamic libggml-cpu.so plugin found"
            exit 1
          fi
          if grep -q 'libggml-cpu-android_' apk-contents.txt; then
            echo "Unexpected runtime CPU variant plugin found"
            exit 1
          fi

          unzip -p AndroidLLM.apk lib/arm64-v8a/libai-chat.so > /tmp/libai-chat.so
          size=$(stat -c%s /tmp/libai-chat.so)
          echo "Static CPU libai-chat.so size: $size bytes"
          test "$size" -gt 50000000
          strings /tmp/libai-chat.so | grep -q 'AndroidLLM started without a registered llama.cpp backend'
          strings /tmp/libai-chat.so | grep -q 'configured context window exhausted'

          # Do not trust only the Gradle flag. Reject the APK if actual Vulkan
          # backend/pipeline markers leaked into the native library.
          for marker in 'ggml_vk_' 'createComputePipeline' 'Vulkan_Host' 'vkCreateComputePipelines'; do
            if strings /tmp/libai-chat.so | grep -Fq "$marker"; then
              echo "Unexpected Vulkan backend marker in libai-chat.so: $marker"
              exit 1
            fi
          done

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidLLM-standard-apk
          path: AndroidLLM.apk
          if-no-files-found: error

      - name: Publish development release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build AndroidLLM.apk --clobber
          else
            gh release create dev-build AndroidLLM.apk \
              --title "AndroidLLM development build" \
              --notes "AndroidLLM 0.7.4: models stay resident across chat switches, conversation changes reset only KV/chat state, and the pre-v0.7 generic CPU path is restored with KleidiAI and Vulkan disabled." \
              --prerelease
          fi

  install-smoke:
    name: Install ARM64 APK on emulator
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout screenshot helper
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: AndroidLLM-standard-apk

      - name: Verify install on ARM64 Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          target: google_apis
          # GitHub's macOS M1 VM does not expose HVF nested virtualization.
          # Use software CPU emulation rather than failing with HV_UNSUPPORTED.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off
          emulator-boot-timeout: 900
          script: |
            adb install -r AndroidLLM.apk
            adb shell pm path com.johndsdev.androidllm | grep -q '^package:'
            # Stable build keeps the original AndroidLLM package ID

      - name: Upload real UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidLLM-OLED-screenshots
          path: ui-screenshots/*.png
          if-no-files-found: warn
