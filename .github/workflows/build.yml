name: Build AndroidLLM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Fetch pinned llama.cpp
        run: |
          mkdir -p vendor
          git clone --depth 1 --branch b10524 https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          python3 scripts/prepare_llama.py

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AndroidLLM.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidLLM-apk
          path: AndroidLLM.apk
          if-no-files-found: error

      - name: Publish development release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build AndroidLLM.apk --clobber
          else
            gh release create dev-build AndroidLLM.apk \
              --title "AndroidLLM development build" \
              --notes "Automated arm64 debug build using llama.cpp b10524." \
              --prerelease
          fi
