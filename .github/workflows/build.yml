name: Build AndroidLLM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: androidllm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Fetch released llama.cpp
        run: |
          mkdir -p vendor
          git clone --depth 1 --branch b10516 https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          python3 scripts/prepare_llama.py
          python3 scripts/prepare_app.py
          python3 scripts/fix_v030_regressions.py
          python3 scripts/performance_patch.py

      - name: Build CPU backend
        run: gradle --no-daemon :llamaLib:externalNativeBuildDebug

      - name: Stage CPU backend
        run: python3 scripts/stage_cpu_backends.py

      - name: Test downloader
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AndroidLLM.apk

      - name: Verify packaged CPU backend
        run: |
          unzip -l AndroidLLM.apk | tee apk-contents.txt
          grep -q 'lib/arm64-v8a/libggml-cpu.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/libai-chat.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/libggml.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/libggml-base.so' apk-contents.txt
          if grep -q 'libggml-cpu-android_' apk-contents.txt; then
            echo "Unexpected CPU_ALL_VARIANTS backend found; build no longer matches Termux"
            exit 1
          fi

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidLLM-apk
          path: AndroidLLM.apk
          if-no-files-found: error

      - name: Publish development release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build AndroidLLM.apk --clobber
          else
            gh release create dev-build AndroidLLM.apk \
              --title "AndroidLLM development build" \
              --notes "Automated arm64 build using llama.cpp b10516 with a Termux-matched dynamically loaded CPU backend." \
              --prerelease
          fi
