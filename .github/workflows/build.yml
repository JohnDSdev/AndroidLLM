name: Build AndroidLLM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: androidllm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Install Vulkan shader toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev spirv-headers
          dpkg -L spirv-headers | grep -E 'SPIRV-Headers(Config|Targets).*cmake' || true

      - name: Fetch released llama.cpp
        run: |
          mkdir -p vendor
          git clone --depth 1 --branch b10516 https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
          python3 scripts/prepare_llama.py
          python3 scripts/prepare_app.py
          python3 scripts/fix_v030_regressions.py
          python3 scripts/chatgpt_ui_patch.py
          python3 scripts/performance_patch.py
          python3 scripts/runtime_perf_patch.py
          python3 scripts/controls_gpu_patch.py
          python3 scripts/gpu_pp_reliability_patch.py

      - name: Verify generated inference hot path
        run: |
          grep -q 'GGML_CPU_ARM_ARCH=armv8.6-a+dotprod+fp16+i8mm' vendor/llama.cpp/examples/llama.android/lib/build.gradle.kts
          grep -q 'GGML_VULKAN=ON' vendor/llama.cpp/examples/llama.android/lib/build.gradle.kts
          grep -q 'set(GGML_CPU_KLEIDIAI ON)' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/CMakeLists.txt
          grep -q 'cpu_params.n_gpu_layers = 0' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q 'pp_params.n_gpu_layers = -1' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q 'cpu_tail' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q 'cpu_state_before_gpu' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q 'restore_sequence_state(g_context, cpu_state_before_gpu)' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q 'NO_CMAKE_FIND_ROOT_PATH' vendor/llama.cpp/ggml/src/ggml-vulkan/CMakeLists.txt
          grep -q 'stop_generation_position = g_context_size - OVERFLOW_HEADROOM' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q 'configured context window exhausted' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          ! grep -q 'Context full! Shifting' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          ! grep -q 'LOGv("id: %d' vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q 'streamingTextView?.append(chunk)' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'Experimental GPU prompt processing' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          grep -q 'Generation threads' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt
          ! grep -q 'MaterialAlertDialogBuilder' app/src/main/java/com/johndsdev/androidllm/MainActivity.kt

      - name: Test downloader
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AndroidLLM.apk

      - name: Verify static backends
        run: |
          unzip -l AndroidLLM.apk | tee apk-contents.txt
          grep -q 'lib/arm64-v8a/libai-chat.so' apk-contents.txt

          # CPU and Vulkan are compiled into the main native library. No runtime
          # backend plugin/dlopen path is allowed back into the app.
          if grep -q 'lib/arm64-v8a/libggml-cpu.so' apk-contents.txt; then
            echo "Unexpected dynamic libggml-cpu.so plugin found"
            exit 1
          fi
          if grep -q 'libggml-cpu-android_' apk-contents.txt; then
            echo "Unexpected runtime CPU variant plugin found"
            exit 1
          fi

          unzip -p AndroidLLM.apk lib/arm64-v8a/libai-chat.so > /tmp/libai-chat.so
          size=$(stat -c%s /tmp/libai-chat.so)
          echo "Static libai-chat.so size: $size bytes"
          test "$size" -gt 50000000
          strings /tmp/libai-chat.so | grep -q 'AndroidLLM started without a registered llama.cpp backend'
          strings /tmp/libai-chat.so | grep -q 'configured context window exhausted'
          strings /tmp/libai-chat.so | grep -q 'Experimental Vulkan prompt-processing model loaded'

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidLLM-apk
          path: AndroidLLM.apk
          if-no-files-found: error

      - name: Publish development release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view dev-build >/dev/null 2>&1; then
            gh release upload dev-build AndroidLLM.apk --clobber
          else
            gh release create dev-build AndroidLLM.apk \
              --title "AndroidLLM development build" \
              --notes "AndroidLLM 0.7.0: custom in-app settings sheets, runtime/sampling sliders, static optimized CPU generation, and experimental Vulkan prompt-processing-only acceleration." \
              --prerelease
          fi
