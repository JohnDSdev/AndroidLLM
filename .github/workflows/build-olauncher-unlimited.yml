name: Build Olauncher Unlimited Install-Tested

on:
  push:
    branches:
      - build-olauncher-unlimited-20260902
  pull_request:
    branches:
      - build-olauncher-unlimited-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Reconstruct modified Olauncher source
        shell: bash
        run: |
          set -euo pipefail
          cat .olauncher-build/payload.part* | base64 --decode > /tmp/olauncher.tar.xz
          echo "ce833dbe0da43c106cdabd60925fcf465cf78d8d5d3c80d30d306d9c8b135263  /tmp/olauncher.tar.xz" | sha256sum -c -
          mkdir -p olauncher-build
          tar -xJf /tmp/olauncher.tar.xz -C olauncher-build

      - name: Apply install and multiline-label fixes
        shell: bash
        working-directory: olauncher-build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          home = Path('app/src/main/java/app/olauncher/ui/HomeFragment.kt')
          text = home.read_text()
          text, n = re.subn(
              r'(val appView = TextView\(context, null, 0, R\.style\.TextLarge\)\.apply \{\s*layoutParams = LinearLayout\.LayoutParams\(\s*)LinearLayout\.LayoutParams\.WRAP_CONTENT,',
              r'\1LinearLayout.LayoutParams.MATCH_PARENT,',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Expected one dynamic home-app width replacement, got {n}')
          text, n = re.subn(
              r'(\n\s*gravity = prefs\.homeAlignment\s*\n)',
              r'\1                isSingleLine = false\n                setHorizontallyScrolling(false)\n',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Expected one multiline-label replacement, got {n}')
          home.write_text(text)

          gradle = Path('app/build.gradle')
          g = gradle.read_text()
          g, n = re.subn(r'applicationId\s+"[^"]+"', 'applicationId "app.olauncher.fontpicker.unlimited"', g, count=1)
          if n != 1:
              raise SystemExit('Could not set applicationId')
          g, n = re.subn(r'versionCode\s+\d+', 'versionCode 113', g, count=1)
          if n != 1:
              raise SystemExit('Could not set versionCode')
          g, n = re.subn(r'versionName\s+"[^"]+"', 'versionName "v6.7.1-fonts4-unlimited2"', g, count=1)
          if n != 1:
              raise SystemExit('Could not set versionName')
          g = g.replace('minifyEnabled true', 'minifyEnabled false')
          gradle.write_text(g)

          accessibility = Path('app/src/main/res/xml/accessibility_service_config.xml')
          a = accessibility.read_text()
          a = re.sub(r'android:packageNames="[^"]*"', 'android:packageNames="app.olauncher.fontpicker.unlimited"', a, count=1)
          accessibility.write_text(a)

          assert 'applicationId "app.olauncher.fontpicker.unlimited"' in gradle.read_text()
          assert 'LinearLayout.LayoutParams.MATCH_PARENT' in home.read_text()
          assert 'isSingleLine = false' in home.read_text()
          PY

      - name: Restore bundled fonts
        shell: bash
        working-directory: olauncher-build
        run: |
          set -euo pipefail
          FONT_DIR="app/src/main/res/font"
          mkdir -p "$FONT_DIR" /tmp/matrix-fonts

          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/f6b2b7e8545e086ad3f821af21895d732b6485cf/ufl/ubuntusans/UbuntuSans%5Bwdth%2Cwght%5D.ttf' \
            --output "$FONT_DIR/ubuntu_sans_regular.ttf"

          curl --fail --location --retry 3 \
            'https://github.com/FriedOrange/MatrixSans/releases/download/v1.722/MatrixSans-v1.722.zip' \
            --output /tmp/matrix-fonts.zip
          echo "0b864d016e15155779fb524472d39c14e22ab396d43bc2bf09fd1d4dbadf1dee  /tmp/matrix-fonts.zip" | sha256sum -c -
          unzip -q /tmp/matrix-fonts.zip -d /tmp/matrix-fonts

          copy_matrix_font() {
            local stem="$1"
            local out="$2"
            local src
            src="$(find /tmp/matrix-fonts -type f \( -iname "${stem}.ttf" -o -iname "${stem}.otf" \) -print -quit)"
            test -n "$src"
            cp "$src" "$FONT_DIR/$out"
          }

          copy_matrix_font 'MatrixSans-Regular' 'matrix_sans_regular.ttf'
          copy_matrix_font 'MatrixSansPrint-Regular' 'matrix_sans_print.ttf'
          copy_matrix_font 'MatrixSansScreen-Regular' 'matrix_sans_screen.ttf'
          copy_matrix_font 'MatrixSansVideo-Regular' 'matrix_sans_video.ttf'

      - name: Build unsigned release APK
        shell: bash
        working-directory: olauncher-build
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon assembleRelease --stacktrace

      - name: Sign and verify APK
        shell: bash
        working-directory: olauncher-build
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*-unsigned.apk' -print -quit)"
          test -n "$UNSIGNED"
          mkdir -p artifact

          keytool -genkeypair -noprompt \
            -keystore /tmp/olauncher-release.p12 \
            -storetype PKCS12 \
            -storepass olauncher2026 \
            -keypass olauncher2026 \
            -alias olauncher \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Olauncher Custom, O=Local Build, C=US'

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" artifact/aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/olauncher-release.p12 \
            --ks-pass pass:olauncher2026 \
            --key-pass pass:olauncher2026 \
            --out artifact/Olauncher-Font-Picker-v6.7.1-fonts4-unlimited2.apk \
            artifact/aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs artifact/Olauncher-Font-Picker-v6.7.1-fonts4-unlimited2.apk | tee artifact/APKSIGNER-VERIFY.txt
          "$BUILD_TOOLS/aapt" dump badging artifact/Olauncher-Font-Picker-v6.7.1-fonts4-unlimited2.apk | head -n 12 | tee artifact/APK-BADGING.txt
          sha256sum artifact/Olauncher-Font-Picker-v6.7.1-fonts4-unlimited2.apk | tee artifact/SHA256SUMS.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install APK on clean Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb install -r olauncher-build/artifact/Olauncher-Font-Picker-v6.7.1-fonts4-unlimited2.apk | tee olauncher-build/artifact/ADB-INSTALL.txt
            adb shell pm path app.olauncher.fontpicker.unlimited | tee olauncher-build/artifact/ADB-PACKAGE-PATH.txt
            grep -q '^package:' olauncher-build/artifact/ADB-PACKAGE-PATH.txt

      - name: Upload install-tested APK
        uses: actions/upload-artifact@v4
        with:
          name: Olauncher-Font-Picker-v6.7.1-fonts4-unlimited2-install-tested
          path: |
            olauncher-build/artifact/Olauncher-Font-Picker-v6.7.1-fonts4-unlimited2.apk
            olauncher-build/artifact/SHA256SUMS.txt
            olauncher-build/artifact/APKSIGNER-VERIFY.txt
            olauncher-build/artifact/APK-BADGING.txt
            olauncher-build/artifact/ADB-INSTALL.txt
            olauncher-build/artifact/ADB-PACKAGE-PATH.txt
          if-no-files-found: error
          retention-days: 7
