name: Build Olauncher Unlimited

on:
  push:
    branches:
      - build-olauncher-unlimited-20260902
  pull_request:
    branches:
      - build-olauncher-unlimited-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Reconstruct modified Olauncher source
        shell: bash
        run: |
          set -euo pipefail
          cat .olauncher-build/payload.part* | base64 --decode > /tmp/olauncher.tar.xz
          echo "ce833dbe0da43c106cdabd60925fcf465cf78d8d5d3c80d30d306d9c8b135263  /tmp/olauncher.tar.xz" | sha256sum -c -
          mkdir -p olauncher-build
          tar -xJf /tmp/olauncher.tar.xz -C olauncher-build

      - name: Restore bundled fonts
        shell: bash
        working-directory: olauncher-build
        run: |
          set -euo pipefail
          FONT_DIR="app/src/main/res/font"
          mkdir -p "$FONT_DIR" /tmp/matrix-fonts

          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/f6b2b7e8545e086ad3f821af21895d732b6485cf/ufl/ubuntusans/UbuntuSans%5Bwdth%2Cwght%5D.ttf' \
            --output "$FONT_DIR/ubuntu_sans_regular.ttf"

          curl --fail --location --retry 3 \
            'https://github.com/FriedOrange/MatrixSans/releases/download/v1.722/MatrixSans-v1.722.zip' \
            --output /tmp/matrix-fonts.zip
          echo "0b864d016e15155779fb524472d39c14e22ab396d43bc2bf09fd1d4dbadf1dee  /tmp/matrix-fonts.zip" | sha256sum -c -
          unzip -q /tmp/matrix-fonts.zip -d /tmp/matrix-fonts

          copy_matrix_font() {
            local stem="$1"
            local out="$2"
            local src
            src="$(find /tmp/matrix-fonts -type f \( -iname "${stem}.ttf" -o -iname "${stem}.otf" \) -print -quit)"
            if [[ -z "$src" ]]; then
              echo "Missing Matrix Sans font: $stem" >&2
              find /tmp/matrix-fonts -type f | sort >&2
              exit 1
            fi
            cp "$src" "$FONT_DIR/$out"
          }

          copy_matrix_font 'MatrixSans-Regular' 'matrix_sans_regular.ttf'
          copy_matrix_font 'MatrixSansPrint-Regular' 'matrix_sans_print.ttf'
          copy_matrix_font 'MatrixSansScreen-Regular' 'matrix_sans_screen.ttf'
          copy_matrix_font 'MatrixSansVideo-Regular' 'matrix_sans_video.ttf'

      - name: Build debug APK
        id: gradle_build
        continue-on-error: true
        shell: bash
        working-directory: olauncher-build
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Annotate Gradle compiler errors
        if: steps.gradle_build.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines = Path('gradle-build.log').read_text(errors='replace').splitlines()
          patterns = re.compile(r'(^e: |\berror:|Compilation error|Unresolved reference|Type mismatch|Cannot infer|Overload resolution ambiguity|None of the following candidates|What went wrong)', re.I)
          picked = [line for line in lines if patterns.search(line)]
          if not picked:
              picked = lines[-80:]
          for line in picked[-100:]:
              safe = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{safe}')
          PY

      - name: Stop after Gradle failure
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Prepare APK artifact
        shell: bash
        working-directory: olauncher-build
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" artifact/Olauncher-Font-Picker-v6.7.1-fonts4-unlimited.apk
          sha256sum artifact/Olauncher-Font-Picker-v6.7.1-fonts4-unlimited.apk | tee artifact/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Olauncher-Font-Picker-v6.7.1-fonts4-unlimited-apk
          path: |
            olauncher-build/artifact/Olauncher-Font-Picker-v6.7.1-fonts4-unlimited.apk
            olauncher-build/artifact/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
