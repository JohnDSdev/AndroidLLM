name: Diagnose built APK
on:
  pull_request:
    paths: [.github/workflows/check-built-apk.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AndroidLLM-apk
          run-id: 34707588606
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture inference diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r AndroidLLM.apk
            adb install -r AndroidLLM-test.apk
            adb logcat -c
            adb shell am instrument -w -r -e class com.johndsdev.androidllm.SearchAndScrollTest com.johndsdev.androidllm.test/androidx.test.runner.AndroidJUnitRunner | tee emulator-ui-tests.txt
            adb shell am instrument -w -r -e class com.johndsdev.androidllm.InferenceSmokeTest com.johndsdev.androidllm.test/androidx.test.runner.AndroidJUnitRunner | tee emulator-cpu-test.txt
            adb logcat -d > emulator-crash-log.txt
            grep -E 'Fatal signal|FATAL|backtrace|libai-chat|Assertion|assert|ggml|timings|pool' emulator-crash-log.txt | tail -100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AndroidLLM-diagnostics
          path: emulator-*
